<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الفاتورة السحابية الإلكترونية</title>
    <style>
        :root {
            --brand-dark-slate: #0f172a;
            --brand-blue: #2563eb;
            --brand-emerald: #059669;
            --brand-bg: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--brand-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: var(--brand-dark-slate);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .invoice-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
            padding: 25px;
            margin-bottom: 25px;
        }

        .invoice-header-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--brand-blue);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--brand-bg);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .info-value {
            font-size: 16px;
            color: var(--brand-dark-slate);
            font-weight: bold;
        }

        .table-responsive {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--brand-dark-slate);
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .text-center { text-align: center; }

        .invoice-summary {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            padding: 15px 20px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: var(--brand-dark-slate);
        }

        .total-highlight {
            color: var(--brand-emerald);
            margin-right: 10px;
        }

        .status-message {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: bold;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--brand-blue);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<header>📒 بـوابة الفواتير الإلكترونية السحابية</header>

<div class="container">
    <div id="mainContent">
        <div class="status-message">
            <div class="spinner"></div>
            جاري جلب بيانات الفاتورة الرقمية من السيرفر السحابي الآمن...
        </div>
    </div>
</div>

<script>
// رابط السيرفر الفعلي المباشر الخاص بك
const CloudServerUrl = "https://script.google.com/macros/s/AKfycbx4ezTTarc4aVuQ1VR6dxQTMRGgJaaJ1OPGPxCiRGMYzPB3MKikKA7HuJ_vjzxkOu6h3Q/exec";

async function loadInvoiceData() {
    const urlParams = new URLSearchParams(window.location.search);
    const invoiceId = urlParams.get('invoiceId'); 

    const contentDiv = document.getElementById("mainContent");

    if (!invoiceId) {
        contentDiv.innerHTML = `<div class="status-message" style="color: #e11d48;">⚠️ عذراً، لم يتم العثور على معرّف أو رقم الفاتورة المطلوبة بالرابط.</div>`;
        return;
    }

    try {
        // طلب الـ GET للسيرفر لجلب الفاتورة المحددة
        const response = await fetch(`${CloudServerUrl}?invoiceId=${encodeURIComponent(invoiceId)}`);
        
        if (!response.ok) {
            throw new Error("فشل الاتصال بالسيرفر السحابي");
        }

        let result = await response.json();

        // معالجة هامة: إذا كانت البيانات قادمة من السيرفر المطور كنص، نقوم بفكها
        if (typeof result === "string") {
            result = JSON.parse(result);
        }

        // التحقق من صحة الفاتورة المسترجعة وفقاً للأسماء البرمجية الجديدة والقديمة
        if (!result || result.status === "not_found" || (!result.invoiceNo && !result.InvoiceNo)) {
            contentDiv.innerHTML = `<div class="status-message" style="color: #ea580c;">📋 الفاتورة رقم (${invoiceId}) غير مسجلة حالياً على السيرفر السحابي أو انتهت صلاحية تخزينها المؤقت.</div>`;
            return;
        }

        // رسم الواجهة بالبيانات الصحيحة
        renderInvoice(result);

    } catch (err) {
        console.error(err);
        contentDiv.innerHTML = `<div class="status-message" style="color: #e11d48;">❌ حدث خطأ غير متوقع أثناء جلب البيانات من السيرفر المحمي.</div>`;
    }
}

function renderInvoice(inv) {
    const contentDiv = document.getElementById("mainContent");
    
    // دعم القراءة الذكية للمصطلحات (سواء أرسلت بالحرف الصغير أو الكبير من السي شارب)
    const invoiceNo = inv.invoiceNo || inv.InvoiceNo || "-";
    const customerName = inv.customer || inv.customerName || inv.CustomerName || "عميل نقدي";
    const phone = inv.phone || inv.Phone || "-";
    const createdAt = inv.date || inv.createdAt || inv.CreatedAt || "-";
    const paymentMethod = inv.payment || inv.paymentMethod || inv.PaymentMethod || "كاش";
    const priceMode = inv.priceMode || inv.PriceMode || "قطاعي";
    const totalAmount = inv.total || inv.totalAmount || inv.TotalAmount || 0;
    const itemsList = inv.items || inv.Items || [];

    let html = `
        <div class="invoice-card">
            <div class="invoice-header-title">📄 تفاصيل الفاتورة الرسمية العامة</div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">رقم الفاتورة</span>
                    <span class="info-value" style="color: var(--brand-blue);">${invoiceNo}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">اسم العميل</span>
                    <span class="info-value">${customerName}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">رقم الهاتف</span>
                    <span class="info-value" dir="ltr">${phone}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">تاريخ الإصدار</span>
                    <span class="info-value">${createdAt}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">طريقة الدفع</span>
                    <span class="info-value">${paymentMethod}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">نظام الأسعار</span>
                    <span class="info-value">${priceMode}</span>
                </div>
            </div>
        </div>

        <div class="invoice-card" style="padding-top: 15px;">
            <div class="invoice-header-title">📦 الأصناف والمستحضرات المسجلة</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th class="text-center" style="width: 15%;">كود الصنف</th>
                            <th>اسم المستحضر / الصنف</th>
                            <th class="text-center" style="width: 15%;">الكمية</th>
                            <th class="text-center" style="width: 15%;">السعر الحالي</th>
                            <th class="text-center" style="width: 15%;">الإجمالي الصافي</th>
                        </tr>
                    </thead>
                    <tbody>
    `;

    if (itemsList.length > 0) {
        itemsList.forEach(item => {
            const itemCode = item.code || item.ItemCode || "-";
            const itemName = item.name || item.ItemName || "-";
            const qty = item.qty || item.Qty || 0;
            const price = item.price || item.Price || 0;
            const total = item.total || item.Total || (qty * price);

            html += `
                <tr>
                    <td class="text-center" style="color: var(--text-muted); font-weight: 600;">${itemCode}</td>
                    <td style="font-weight: 600; color: var(--brand-dark-slate);">${itemName}</td>
                    <td class="text-center">${qty}</td>
                    <td class="text-center">${parseFloat(price).toFixed(2)}</td>
                    <td class="text-center" style="font-weight: bold; color: var(--brand-dark-slate);">${parseFloat(total).toFixed(2)}</td>
                </tr>
            `;
        });
    } else {
        html += `<tr><td colspan="5" class="text-center" style="color: var(--text-muted);">لا توجد عناصر مدرجة لهذه الفاتورة.</td></tr>`;
    }

    html += `
                    </tbody>
                </table>
            </div>

            <div class="invoice-summary">
                <span>إجمالي الفاتورة النهائي: </span>
                <span class="total-highlight">${parseFloat(totalAmount).toFixed(2)} ج.م</span>
            </div>
        </div>
    `;

    contentDiv.innerHTML = html;
}

window.onload = loadInvoiceData;
</script>

</body>
</html>
