<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل الفواتير</title>
<style>
body { font-family: Tahoma, sans-serif; background-color: #f5f5f5; margin: 0; }
header { background-color: #2196F3; color: white; padding: 15px; text-align: center; font-size: 24px; }
table { width: 95%; margin: 20px auto; border-collapse: collapse; background-color: white; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background-color: #2196F3; color: white; }
tr:nth-child(even) { background-color: #f9f9f9; }
</style>
</head>
<body>
<header>📒 سجل الفواتير</header>
<table id="invoiceTable">
<thead>
<tr>
<th>رقم الفاتورة</th>
<th>العميل</th>
<th>الهاتف</th>
<th>نوع البيع</th>
<th>الإجمالي</th>
<th>طريقة الدفع</th>
<th>التاريخ</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
// استدعاء البيانات من رابط URL
function loadInvoiceData() {
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');

    if (!dataParam) {
        const tbody = document.querySelector("#invoiceTable tbody");
        tbody.innerHTML = "<tr><td colspan='7'>لا توجد بيانات لعرضها</td></tr>";
        return;
    }

    try {
        const jsonStr = decodeURIComponent(dataParam);
        const invoices = JSON.parse(atob(jsonStr)); // تحويل Base64 الى JSON

        const tbody = document.querySelector("#invoiceTable tbody");
        tbody.innerHTML = "";

        if (invoices.length === 0) {
            tbody.innerHTML = "<tr><td colspan='7'>لا توجد فواتير</td></tr>";
            return;
        }

        invoices.forEach(inv => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${inv.invoiceNo || "-"}</td>
                <td>${inv.customer || "-"}</td>
                <td>${inv.phone || "-"}</td>
                <td>${inv.priceMode || "-"}</td>
                <td>${inv.total || "0.00"}</td>
                <td>${inv.payment || "-"}</td>
                <td>${inv.date || "-"}</td>
            `;
            tbody.appendChild(row);
        });

    } catch (err) {
        console.error("حدث خطأ عند تحميل البيانات:", err);
        const tbody = document.querySelector("#invoiceTable tbody");
        tbody.innerHTML = "<tr><td colspan='7'>حدث خطأ في تحميل البيانات</td></tr>";
    }
}

// استدعاء الدالة عند تحميل الصفحة
window.onload = loadInvoiceData;
</script>
</body>
</html>
