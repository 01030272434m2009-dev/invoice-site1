<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل الفواتير</title>

<style>
body{
    font-family:Tahoma,sans-serif;
    background:#f5f5f5;
    margin:0;
}
header{
    background:#2196F3;
    color:white;
    padding:15px;
    text-align:center;
    font-size:24px;
}
#searchBox{
    display:block;
    width:95%;
    margin:10px auto;
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:4px;
}
table{
    width:95%;
    margin:20px auto;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}
th{
    background:#2196F3;
    color:white;
}
tr:nth-child(even){
    background:#f9f9f9;
}
tr:hover{
    background:#eef6ff;
}
</style>
</head>

<body>

<header>📒 سجل الفواتير</header>

<input type="text" id="searchBox" placeholder="ابحث بالعميل أو رقم الفاتورة">

<table id="invoiceTable">
<thead>
<tr>
<th>رقم الفاتورة</th>
<th>العميل</th>
<th>الهاتف</th>
<th>نوع البيع</th>
<th>الإجمالي</th>
<th>طريقة الدفع</th>
<th>التاريخ</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
// مصفوفة لتخزين الفواتير
let invoices = []

// دالة لفك Base64 + GZip
async function decompressBase64Gzip(base64Str) {
    const raw = atob(base64Str)
    const buf = new Uint8Array(raw.length)
    for(let i=0;i<raw.length;i++) buf[i]=raw.charCodeAt(i)
    const decompressed = await new Response(new Blob([buf])).arrayBuffer()
    const ds = new DecompressionStream("gzip")
    const decompressedStream = buf.stream().pipeThrough(ds)
    const text = await new Response(decompressedStream).text()
    return text
}

// تحميل البيانات من الرابط
async function loadInvoiceData() {
    const params = new URLSearchParams(window.location.search)
    const dataParam = params.get("data")
    const tbody = document.querySelector("#invoiceTable tbody")
    tbody.innerHTML = ""

    if (!dataParam) {
        showEmpty("لا توجد بيانات لعرضها")
        return
    }

    try {
        // فك الرابط Base64 + GZip
        const jsonStr = await decompressBase64Gzip(decodeURIComponent(dataParam))
        invoices = JSON.parse(jsonStr)

        if (!Array.isArray(invoices) || invoices.length === 0) {
            showEmpty("لا توجد فواتير")
            return
        }

        renderTable(invoices)
    } catch (err) {
        console.error(err)
        showEmpty("حدث خطأ في تحميل البيانات")
    }
}

// رسم الجدول
function renderTable(data){
    const tbody = document.querySelector("#invoiceTable tbody")
    tbody.innerHTML = ""
    data.forEach(inv=>{
        const row = document.createElement("tr")
        row.innerHTML = `
            <td>${inv.invoiceNo||"-"}</td>
            <td>${inv.customer||"-"}</td>
            <td>${inv.phone||"-"}</td>
            <td>${inv.priceMode||"-"}</td>
            <td>${inv.total||"0.00"}</td>
            <td>${inv.payment||"-"}</td>
            <td>${inv.date||"-"}</td>
        `
        tbody.appendChild(row)
    })
}

// عرض رسالة عند عدم وجود بيانات
function showEmpty(msg){
    const tbody = document.querySelector("#invoiceTable tbody")
    tbody.innerHTML=`<tr><td colspan="7">${msg}</td></tr>`
}

// البحث
document.getElementById("searchBox").addEventListener("input", function(){
    const q = this.value.toLowerCase()
    const filtered = invoices.filter(inv=>
        (inv.customer && inv.customer.toLowerCase().includes(q)) ||
        (inv.invoiceNo && inv.invoiceNo.toLowerCase().includes(q))
    )
    renderTable(filtered)
})

// استدعاء عند تحميل الصفحة
window.onload = loadInvoiceData
</script>

</body>
</html>
