<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الفاتورة السحابية الإلكترونية</title>
    <style>
        :root {
            --brand-dark-slate: #0f172a;
            --brand-blue: #2563eb;
            --brand-emerald: #059669;
            --brand-bg: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--brand-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* الهيدر المودرن */
        header {
            background: var(--brand-dark-slate);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        /* كارت معلومات الفاتورة الرئيسي */
        .invoice-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
            padding: 25px;
            margin-bottom: 25px;
        }

        .invoice-header-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--brand-blue);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--brand-bg);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* شبكة البيانات الموزعة */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .info-value {
            font-size: 16px;
            color: var(--brand-dark-slate);
            font-weight: bold;
        }

        /* جدول العناصر والمبيعات */
        .table-responsive {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--brand-dark-slate);
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:nth-child(even) {
            background-color: #fsfafc;
        }

        .text-center { text-align: center; }
        .text-left { text-align: left; }

        /* منطقة الإجمالي النهائي السفلي */
        .invoice-summary {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            padding: 15px 20px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: var(--brand-dark-slate);
        }

        .total-highlight {
            color: var(--brand-emerald);
            margin-right: 10px;
        }

        /* شاشة الانتظار والرسائل */
        .status-message {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: bold;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--brand-blue);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<header>📒 بـوابة الفواتير الإلكترونية السحابية</header>

<div class="container">
    <div id="mainContent">
        <div class="status-message">
            <div class="spinner"></div>
            جاري جلب بيانات الفاتورة الرقمية من السيرفر السحابي الآمن...
        </div>
    </div>
</div>

<script>
// رابط السيرفر السحابي الخاص بك (Apps Script API Web App)
// ملاحظة: تأكد أن هذا الرابط يطابق تماماً الرابط الموجود بكود الـ C#
const CloudServerUrl = "https://script.google.com/macros/s/YOUR_SCRIPT_ID_HERE/exec";

// دالة لجلب الفاتورة من السيرفر عند تحميل الصفحة
async function loadInvoiceData() {
    const urlParams = new URLSearchParams(window.location.search);
    const invoiceId = urlParams.get('invoiceId'); // قراءة رقم الفاتورة من الرابط المباشر الجديد

    const contentDiv = document.getElementById("mainContent");

    if (!invoiceId) {
        contentDiv.innerHTML = `<div class="status-message" style="color: #e11d48;">⚠️ عذراً، لم يتم العثور على معرّف أو رقم الفاتورة المطلوبة بالرابط.</div>`;
        return;
    }

    try {
        // الاتصال بالسيرفر وجلب بيانات الفاتورة المحددة عبر الـ ID
        // نقوم بإرسال طلب الـ GET للسيرفر مع تمريير رقم الفاتورة كـ Parameter
        const response = await fetch(`${CloudServerUrl}?invoiceId=${encodeURIComponent(invoiceId)}`);
        
        if (!response.ok) {
            throw new Error("فشل الاتصال بالسيرفر السحابي");
        }

        const result = await response.json();

        // التحقق من وجود بيانات فعلية راجعة للفاتورة
        if (!result || result.status === "not_found" || !result.invoiceNo) {
            contentDiv.innerHTML = `<div class="status-message" style="color: #ea580c;">📋 الفاتورة رقم (${invoiceId}) غير مسجلة حالياً على السيرفر السحابي أو تم حذفها.</div>`;
            return;
        }

        // رسم واجهة الفاتورة الفلات الاحترافية للمستخدم بالبيانات المسترجعة
        renderInvoice(result);

    } catch (err) {
        console.error(err);
        contentDiv.innerHTML = `<div class="status-message" style="color: #e11d48;">❌ حدث خطأ غير متوقع أثناء جلب البيانات من السيرفر المحمي.</div>`;
    }
}

// دالة لبناء واجهة الفاتورة المودرن بالكامل
function renderInvoice(inv) {
    const contentDiv = document.getElementById("mainContent");
    
    // بناء رأس الفاتورة والكروت الإحصائية للمعلومات الأساسية
    let html = `
        <div class="invoice-card">
            <div class="invoice-header-title">📄 تفاصيل الفاتورة الرسمية العامه</div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">رقم الفاتورة</span>
                    <span class="info-value" style="color: var(--brand-blue);">${inv.invoiceNo || "-"}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">اسم العميل</span>
                    <span class="info-value">${inv.customer || "عميل نقدي"}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">رقم الهاتف</span>
                    <span class="info-value" dir="ltr">${inv.phone || "-"}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">تاريخ الإصدار</span>
                    <span class="info-value">${inv.date || "-"}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">طريقة الدفع</span>
                    <span class="info-value">${inv.payment || "كاش"}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">نظام الأسعار</span>
                    <span class="info-value">${inv.priceMode || "قطاعي"}</span>
                </div>
            </div>
        </div>

        <div class="invoice-card" style="padding-top: 15px;">
            <div class="invoice-header-title">📦 الأصناف والمستحضرات المسجلة</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th class="text-center" style="width: 15%;">كود الصنف</th>
                            <th>اسم المستحضر / الصنف</th>
                            <th class="text-center" style="width: 15%;">الكمية</th>
                            <th class="text-center" style="width: 15%;">السعر الحالي</th>
                            <th class="text-center" style="width: 15%;">الإجمالي الصافي</th>
                        </tr>
                    </thead>
                    <tbody>
    `;

    // إضافة الأصناف المباعة داخل الجدول
    if (inv.items && inv.items.length > 0) {
        inv.items.forEach(item => {
            html += `
                <tr>
                    <td class="text-center" style="color: var(--text-muted); font-weight: 600;">${item.code || "-"}</td>
                    <td style="font-weight: 600; color: var(--brand-dark-slate);">${item.name || "-"}</td>
                    <td class="text-center">${item.qty || 0}</td>
                    <td class="text-center">${parseFloat(item.price).toFixed(2)}</td>
                    <td class="text-center" style="font-weight: bold; color: var(--brand-dark-slate);">${parseFloat(item.total).toFixed(2)}</td>
                </tr>
            `;
        });
    } else {
        html += `<tr><td colspan="5" class="text-center" style="color: var(--text-muted);">لا توجد عناصر مدرجة لهذه الفاتورة.</td></tr>`;
    }

    html += `
                    </tbody>
                </table>
            </div>

            <div class="invoice-summary">
                <span>إجمالي الفاتورة النهائي: </span>
                <span class="total-highlight">${parseFloat(inv.total || 0).toFixed(2)} ج.م</span>
            </div>
        </div>
    `;

    contentDiv.innerHTML = html;
}

// تشغيل دالة الجلب بمجرد تحميل الصفحة تماماً
window.onload = loadInvoiceData;
</script>

</body>
</html>
