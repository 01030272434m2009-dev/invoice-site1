<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل الفواتير</title>
<style>
body{font-family:Tahoma,sans-serif;background:#f5f5f5;margin:0;}
header{background:#2196F3;color:white;padding:15px;text-align:center;font-size:24px;}
#searchBox{display:block;width:95%;margin:10px auto;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:4px;}
table{width:95%;margin:20px auto;border-collapse:collapse;background:white;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
th,td{border:1px solid #ddd;padding:10px;text-align:center;}
th{background:#2196F3;color:white;}
tr:nth-child(even){background:#f9f9f9;}
tr:hover{background:#eef6ff;cursor:pointer;}
.detailsTable{width:90%;margin:10px auto 30px auto;border-collapse:collapse;}
.detailsTable th, .detailsTable td{border:1px solid #ccc;padding:8px;text-align:center;}
.detailsTable th{background:#2196F3;color:white;}
.detailsTable tr:nth-child(even){background:#f0f0f0;}
.detailsHeader{width:95%;margin:10px auto;font-weight:bold;color:#333;}
</style>
</head>
<body>

<header>📒 سجل الفواتير</header>
<input type="text" id="searchBox" placeholder="ابحث بالعميل أو رقم الفاتورة">
<table id="invoiceTable">
<thead>
<tr>
<th>رقم الفاتورة</th>
<th>العميل</th>
<th>الهاتف</th>
<th>نوع البيع</th>
<th>الإجمالي</th>
<th>طريقة الدفع</th>
<th>التاريخ</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div id="invoiceDetails"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script>
let invoices = [];

// دالة لفك GZip + Base64
function decodeGzipBase64(base64Str){
    try{
        const binaryStr = atob(base64Str);
        const charData = binaryStr.split('').map(c=>c.charCodeAt(0));
        const binData = new Uint8Array(charData);
        const decompressed = pako.inflate(binData, { to: 'string' });
        return JSON.parse(decompressed);
    } catch(err){
        console.error("خطأ في فك البيانات:", err);
        return [];
    }
}

// تحميل البيانات من الرابط
function loadInvoiceData(){
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');

    if(!dataParam){
        showEmpty("لا توجد بيانات لعرضها");
        return;
    }

    try{
        invoices = decodeGzipBase64(decodeURIComponent(dataParam));
        if(!Array.isArray(invoices) || invoices.length===0){
            showEmpty("لا توجد فواتير");
            return;
        }
        renderTable(invoices);
    } catch(err){
        console.error(err);
        showEmpty("حدث خطأ في قراءة البيانات");
    }
}

// رسم الجدول
function renderTable(data){
    const tbody = document.querySelector("#invoiceTable tbody");
    tbody.innerHTML = "";
    data.forEach(inv=>{
        const row = document.createElement("tr");
        row.innerHTML=`
        <td>${inv.invoiceNo||"-"}</td>
        <td>${inv.customer||"-"}</td>
        <td>${inv.phone||"-"}</td>
        <td>${inv.priceMode||"-"}</td>
        <td>${inv.total||"0.00"}</td>
        <td>${inv.payment||"-"}</td>
        <td>${inv.date||"-"}</td>
        `;
        row.addEventListener('click',()=>showDetails(inv));
        tbody.appendChild(row);
    });
}

// عرض رسالة عند عدم وجود بيانات
function showEmpty(msg){
    const tbody = document.querySelector("#invoiceTable tbody");
    tbody.innerHTML = `<tr><td colspan="7">${msg}</td></tr>`;
}

// البحث
document.getElementById("searchBox").addEventListener("input", function(){
    const q = this.value.toLowerCase();
    const filtered = invoices.filter(inv =>
        (inv.customer && inv.customer.toLowerCase().includes(q)) ||
        (inv.invoiceNo && inv.invoiceNo.toLowerCase().includes(q))
    );
    renderTable(filtered);
    document.getElementById("invoiceDetails").innerHTML=""; // مسح التفاصيل عند البحث
});

// عرض تفاصيل الفاتورة
function showDetails(inv){
    if(!inv.items || inv.items.length===0){
        document.getElementById("invoiceDetails").innerHTML="<p class='detailsHeader'>لا توجد تفاصيل لهذه الفاتورة</p>";
        return;
    }

    let html = `<p class='detailsHeader'>تفاصيل الفاتورة رقم ${inv.invoiceNo} للعميل ${inv.customer}</p>`;
    html += `<table class='detailsTable'>
    <thead>
        <tr>
            <th>كود الصنف</th>
            <th>اسم الصنف</th>
            <th>الكمية</th>
            <th>السعر</th>
            <th>الإجمالي</th>
        </tr>
    </thead>
    <tbody>`;

    inv.items.forEach(item=>{
        html += `<tr>
        <td>${item.code||"-"}</td>
        <td>${item.name||"-"}</td>
        <td>${item.qty||0}</td>
        <td>${item.price||0.00}</td>
        <td>${item.total||0.00}</td>
        </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById("invoiceDetails").innerHTML = html;
}

// تحميل البيانات عند فتح الصفحة
window.onload = loadInvoiceData;
</script>

</body>
</html>
